<!DOCTYPE html> 
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tính Lương & Chấm Công</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { max-width: 900px; margin: 0 auto; padding: 20px; background: #f5f7fa; }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
    .card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .month-nav button { padding: 8px 16px; border: none; background: #3498db; color: white; border-radius: 6px; cursor: pointer; }
    .month-nav button:hover { background: #2980b9; }
    .month-title { font-size: 1.3rem; font-weight: bold; color: #2c3e50; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .day-label { text-align: center; font-weight: bold; padding: 10px 5px; color: #7f8c8d; font-size: 0.9rem; }
    .day { min-height: 70px; padding: 8px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; transition: all 0.2s; background: white; }
    .day:hover { border-color: #3498db; }
    .day.weekend { background: #fef5e7; }
    .day.worked { background: #2ecc71; color: white; border-color: #27ae60; }
    .day.today { box-shadow: inset 0 0 0 2px #e74c3c; }
    .day-num { font-weight: bold; margin-bottom: 4px; }
    .day-hours { font-size: 0.8rem; opacity: 0.85; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; color: #34495e; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
    .result { font-size: 1.1rem; line-height: 1.8; }
    .result strong { color: #27ae60; font-size: 1.2rem; }
    .btn { padding: 10px 18px; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; margin-right: 10px; margin-top: 5px; }
    .btn-primary { background: #3498db; color: white; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn:hover { opacity: 0.9; }
    .note { margin-top: 15px; font-size: 0.85rem; color: #7f8c8d; }
  </style>
</head>
<body>
  <h1>📅 Chấm Công & Tính Lương</h1>

  <div class="card">
    <div class="month-nav">
      <button id="prevMonth">◀ Tháng Trước</button>
      <span class="month-title" id="monthTitle"></span>
      <button id="nextMonth">Tháng Sau ▶</button>
    </div>
    <div class="calendar" id="calendar"></div>
    <p class="note">💡 Nhấp ngày để đánh dấu làm việc; nhấp lại để bỏ. Nhập số giờ làm trong ô bên dưới.</p>
  </div>

  <div class="card">
    <h3>⚙ Thông số tính lương</h3>
    <div class="input-group">
      <label for="defaultHours">Số giờ làm trung bình mỗi ngày:</label>
      <input type="number" id="defaultHours" step="0.5" min="0" max="24" value="8" />
    </div>
    <div class="input-group">
      <label for="ratePerHour">Tiền lương mỗi giờ (VNĐ):</label>
      <input type="number" id="ratePerHour" step="100" min="0" value="50000" />
    </div>
    <button class="btn btn-primary" id="applyHours">✅ Áp dụng giờ cho tất cả ngày đã chọn</button>
    <button class="btn btn-danger" id="clearAll">🗑 Xóa toàn bộ dữ liệu tháng</button>
  </div>

  <div class="card result">
    <h3>📊 Kết quả tính toán</h3>
    <p>Tổng số ngày làm việc: <strong id="totalDays">0</strong> ngày</p>
    <p>Tổng số giờ làm việc: <strong id="totalHours">0</strong> giờ</p>
    <p>Tổng lương: <strong id="totalSalary">0</strong> VNĐ</p>
    <p class="note">💾 Dữ liệu tự động lưu trên trình duyệt của bạn.</p>
  </div>

  <script>
    const monthNames = [
      "Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6",
      "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"
    ];
    const dayNames = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];

    let currentDate = new Date();
    let workData = {}; // { "2026-09-01": { hours: 8, worked: true }, ... }

    // === Lưu & Đọc dữ liệu từ localStorage ===
    function saveData() {
      localStorage.setItem('workSalaryData', JSON.stringify(workData));
    }
    function loadData() {
      const saved = localStorage.getItem('workSalaryData');
      if (saved) workData = JSON.parse(saved);
    }

    // === Lấy khóa tháng-năm ===
    function getMonthKey(year, month) {
      return `${year}-${String(month+1).padStart(2,'0')}`;
    }
    function getDayKey(year, month, day) {
      return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }

    // === Tạo lịch ===
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('monthTitle').textContent = `${monthNames[month]} ${year}`;

      const container = document.getElementById('calendar');
      container.innerHTML = '';

      // Nhãn thứ
      dayNames.forEach(name => {
        const label = document.createElement('div');
        label.className = 'day-label';
        label.textContent = name;
        container.appendChild(label);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = new Date();

      // Ô trống đầu tháng
      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.style.visibility = 'hidden';
        container.appendChild(empty);
      }

      // Các ngày
      for (let day = 1; day <= daysInMonth; day++) {
        const dayKey = getDayKey(year, month, day);
        const d = new Date(year, month, day);
        const dayOfWeek = d.getDay();
        const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
        const isToday = today.getFullYear() === year && today.getMonth() === month && today === day;

        const data = workData[dayKey] || { worked: false, hours: 0 };

        const dayEl = document.createElement('div');
        dayEl.className = 'day';
        if (isWeekend) dayEl.classList.add('weekend');
        if (isToday) dayEl.classList.add('today');
        if (data.worked) dayEl.classList.add('worked');

        dayEl.innerHTML = `
          <div class="day-num">${day}</div>
          <div class="day-hours">${data.worked ? data.hours + 'h' : ''}</div>
        `;
        dayEl.title = data.worked ? `Đã làm ${data.hours} giờ — Nhấp bỏ chọn` : 'Nhấp đánh dấu làm việc';

        dayEl.addEventListener('click', () => toggleDay(dayKey, dayEl));
        container.appendChild(dayEl);
      }

      updateResult();
    }

    // === Bật/Tắt chọn ngày ===
    function toggleDay(dayKey, dayEl) {
      const defaultHours = parseFloat(document.getElementById('defaultHours').value) || 8;
      if (!workData[dayKey]?.worked) {
        workData[dayKey] = { worked: true, hours: defaultHours };
        dayEl.classList.add('worked');
      } else {
        delete workData[dayKey];
        dayEl.classList.remove('worked');
      }
      saveData();
      renderCalendar();
    }

    // === Cập nhật kết quả ===
    function updateResult() {
      const rate = parseFloat(document.getElementById('ratePerHour').value) || 0;
      let totalDays = 0, totalHours = 0;

      Object.values(workData).forEach(d => {
        if (d.worked) {
          totalDays++;
          totalHours += d.hours || 0;
        }
      });

      const totalSalary = totalHours * rate;
      document.getElementById('totalDays').textContent = totalDays;
      document.getElementById('totalHours').textContent = totalHours.toFixed(1);
      document.getElementById('totalSalary').textContent = totalSalary.toLocaleString('vi-VN');
    }

    // === Áp dụng số giờ cho tất cả ngày đã chọn ===
    function applyHoursToAll() {
      const hours = parseFloat(document.getElementById('defaultHours').value) || 8;
      Object.keys(workData).forEach(key => {
        if (workData[key].worked) workData[key].hours = hours;
      });
      saveData();
      renderCalendar();
      alert(`✅ Đã áp dụng ${hours} giờ cho tất cả ngày đã chọn!`);
    }

    // === Xóa dữ liệu tháng hiện tại ===
    function clearCurrentMonth() {
      const year = currentDate.getFullYear();
      const monthKey = getMonthKey(year, currentDate.getMonth());
      Object.keys(workData).forEach(key => {
        if (key.startsWith(monthKey + '-')) delete workData[key];
      });
      saveData();
      renderCalendar();
      alert('🗑 Đã xóa dữ liệu tháng!');
    }

    // === Khởi tạo ===
    document.getElementById('prevMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });
    document.getElementById('applyHours').addEventListener('click', applyHoursToAll);
    document.getElementById('clearAll').addEventListener('click', clearCurrentMonth);
    document.getElementById('ratePerHour').addEventListener('input', updateResult);
    document.getElementById('defaultHours').addEventListener('input', updateResult);

    loadData();
    renderCalendar();
  </script>
</body>
</html>
